org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
# MAPBOX_DOWNLOADS_TOKEN wird aus android/local.properties gelesen (gitignored).
# Siehe android/build.gradle credentials-Block.

# R8 Full Mode deaktivieren — sonst schlaegt der Release-Build mit
# "Missing class javax.xml.stream.XMLStreamException" fehl (transitive dep
# von Apache Tika via file_picker). Im full mode werden missing classes
# als fatal errors behandelt, -dontwarn reicht dann nicht.
android.enableR8.fullMode=false
