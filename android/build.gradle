// Mapbox Tokens aus local.properties laden (gitignored, niemals im Repo)
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localProps.load(new FileInputStream(localPropsFile))
}
def mapboxDownloadsToken = localProps.getProperty('MAPBOX_DOWNLOADS_TOKEN') ?: (System.getenv('MAPBOX_DOWNLOADS_TOKEN') ?: '')

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = "mapbox"
                password = mapboxDownloadsToken
            }
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}
subprojects { sub ->
    sub.pluginManager.withPlugin('com.android.library') {
        if (sub.android.namespace == null) {
            def manifest = file("${sub.projectDir}/src/main/AndroidManifest.xml")
            if (manifest.exists()) {
                def pkg = new XmlParser().parse(manifest).attribute('package')
                if (pkg) {
                    sub.android.namespace = pkg
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}