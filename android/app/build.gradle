plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

// Release-Keystore aus key.properties laden
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Mapbox Public Token aus local.properties (gitignored) — per Manifest Placeholder eingespielt
def localPropsApp = new Properties()
def localPropsFileApp = rootProject.file('local.properties')
if (localPropsFileApp.exists()) {
    localPropsApp.load(new FileInputStream(localPropsFileApp))
}
def mapboxPublicToken = localPropsApp.getProperty('MAPBOX_PUBLIC_TOKEN') ?: (System.getenv('MAPBOX_PUBLIC_TOKEN') ?: '')

android {
    namespace "com.bikergram.app"

    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.bikergram.app"

        minSdk 24
        targetSdk 35
        multiDexEnabled true

        versionCode flutter.versionCode
        versionName flutter.versionName

        // Mapbox Public Token aus local.properties in Manifest einspielen
        manifestPlaceholders = [
            MAPBOX_PUBLIC_TOKEN: mapboxPublicToken
        ]
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        debug {
            // Standard ok
        }
    }

    // Play Store Bundle splitting — smaller downloads per device
    bundle {
        language { enableSplit = true }
        density  { enableSplit = true }
        abi      { enableSplit = true }
    }
}

flutter {
    source "../.."
}

configurations.all {
    // firebase-messaging 24.x already contains FirebaseInstanceIdReceiver;
    // exclude the legacy firebase-iid artifact to avoid duplicate-class errors.
    exclude group: "com.google.firebase", module: "firebase-iid"
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
    implementation "com.google.android.material:material:1.12.0"

    // MapLibre — Vektor-Karten via MapSnapshotter
    implementation "org.maplibre.gl:android-sdk:11.8.0"
}
